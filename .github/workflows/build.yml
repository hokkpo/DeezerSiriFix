name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: DeezerSiriFix
          path: .theos/obj/debug/DeezerSiriFix.dylib
